[package]
name = "wallet"
version = "0.1.0"
description = "Experimental classical Solana wallet foundation; not quantum-resistant"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "wallet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
